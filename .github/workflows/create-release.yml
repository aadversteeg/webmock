name: Create Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"  # Also match prerelease versions like v1.0.0-preview.1

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/webmock.sln
      
    - name: Build
      run: dotnet build src/webmock.sln -c Release --no-restore -p:Version=${{ steps.get_version.outputs.VERSION }}
      
    - name: Test
      run: dotnet test src/webmock.sln -c Release --no-build
      
    - name: Create artifacts directory
      run: mkdir -p ./artifacts
      
    - name: Pack
      run: dotnet pack src/Ave.WebMock/Ave.WebMock.csproj -c Release --no-build -p:Version=${{ steps.get_version.outputs.VERSION }} -o ./artifacts
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Ave.WebMock ${{ steps.get_version.outputs.VERSION }}
        files: ./artifacts/*.nupkg
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}