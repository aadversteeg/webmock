name: Create Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"  # Also match prerelease versions like v1.0.0-preview.1

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set version from tag
      id: version
      run: |
        VERSION="${{ github.ref_name }}"
        # Remove 'v' prefix if present
        if [[ $VERSION == v* ]]; then
          VERSION="${VERSION:1}"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_ENV
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/webmock.sln
      
    - name: Build
      run: dotnet build src/webmock.sln -c Release --no-restore -p:Version=${{ env.VERSION }}
      
    - name: Test
      run: dotnet test src/webmock.sln -c Release --no-build
      
    - name: Create artifacts directory
      run: mkdir -p ./artifacts
      
    - name: Pack
      run: |
        # Parse the version into prefix and suffix if needed
        if [[ "$VERSION" == *"-"* ]]; then
          PREFIX=$(echo $VERSION | cut -d'-' -f1)
          SUFFIX=$(echo $VERSION | cut -d'-' -f2-)
          echo "Packing version $PREFIX-$SUFFIX"
          dotnet pack src/Ave.WebMock/Ave.WebMock.csproj -c Release --no-build \
            -p:VersionPrefix=$PREFIX --version-suffix "$SUFFIX" -p:PackageVersion=$VERSION -o ./artifacts
        else
          echo "Packing version $VERSION"
          dotnet pack src/Ave.WebMock/Ave.WebMock.csproj -c Release --no-build \
            -p:VersionPrefix=$VERSION -p:PackageVersion=$VERSION -o ./artifacts
        fi
        
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ env.VERSION }}
        tag_name: ${{ github.ref_name }}
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        files: |
          ./artifacts/*.nupkg
          ./artifacts/*.snupkg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}